services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-exam}
      POSTGRES_USER: ${POSTGRES_USER:-exam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exam} -d ${POSTGRES_DB:-exam}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_NAME: ${APP_NAME:-JNTUA College Of Engineering Pulivendula Smart Exam Result Management System}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-exam}:${POSTGRES_PASSWORD:-exam}@postgres:5432/${POSTGRES_DB:-exam}
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-me}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: lax
      REFRESH_COOKIE_NAME: exam_refresh_token
      INSTITUTION_NAME: ${INSTITUTION_NAME:-JNTUA College Of Engineering Pulivendula}
      INSTITUTION_ADDRESS: ${INSTITUTION_ADDRESS:-Pulivendula, Andhra Pradesh 516390}
      CERTIFICATE_VERIFICATION_BASE_URL: ${CERTIFICATE_VERIFICATION_BASE_URL:-http://localhost:8080/verify}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_API_MODE: ${VITE_API_MODE:-live}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  upload_data:
